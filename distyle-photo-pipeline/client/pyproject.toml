[project]
name = "distyle-photo"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
    "click>=8.1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["distyle_photo*"]
